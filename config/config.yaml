hubeau:
  base_url: https://hubeau.eaufrance.fr/api/v2/hydrometrie
  station_code: Y251002001
  grandeur_hydro: H
  # Hub'Eau expresses water height in millimetres. The API does not return a unit field.
  unit: mm
  lookback_minutes: 60
  page_size: 500

# Measurement type to the unit this pipeline publishes. Add discharge here, for example Q: l/s.
measurements:
  H: mm

quality:
  # Source observation_time may be this far ahead of the local clock. No water-level limits are applied.
  future_timestamp_tolerance_seconds: 300

kafka:
  bootstrap_servers: localhost:9092
  topic: water.observations.raw

producer:
  poll_interval_seconds: 60
  checkpoint_path: data/checkpoints/producer.json
  max_attempts: 3
  retry_backoff_seconds: 2
  max_pages: 100
  catchup_max_age_days: 30

consumer:
  group_id: water-observations-bronze
  poll_timeout_seconds: 1.0
  retry_seconds: 5
  auto_offset_reset: earliest
  max_poll_interval_ms: 900000
